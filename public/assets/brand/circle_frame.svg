<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="70%" stop-color="#0E0E0E" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2CB57" />
      <stop offset="25%" stop-color="#D9A13B" />
      <stop offset="50%" stop-color="#FCE588" />
      <stop offset="75%" stop-color="#B27B1E" />
      <stop offset="100%" stop-color="#F2CB57" />
    </linearGradient>
    <linearGradient id="goldInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2CB57" />
      <stop offset="50%" stop-color="#996515" />
      <stop offset="100%" stop-color="#F2CB57" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#D9A13B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="400" cy="400" r="390" fill="url(#darkBg)" />

  <!-- Outer thick gold rim -->
  <circle cx="400" cy="400" r="388" fill="none" stroke="url(#goldRim)" stroke-width="6" filter="url(#goldGlow)" />

  <!-- Secondary inner thin gold ring -->
  <circle cx="400" cy="400" r="375" fill="none" stroke="url(#goldInner)" stroke-width="2" opacity="0.8" />

  <!-- Dotted decorative celestial ring -->
  <circle cx="400" cy="400" r="364" fill="none" stroke="#D9A13B" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.6" />

  <!-- Inner border ring -->
  <circle cx="400" cy="400" r="352" fill="none" stroke="url(#goldRim)" stroke-width="1" opacity="0.7" />
</svg>
